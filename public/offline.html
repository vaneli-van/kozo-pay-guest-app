<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Klown Pay — offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0d0d0f; color: #f5f5f4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .wrap { max-width: 340px; }
  .mark { width: 72px; height: 72px; border-radius: 18px; background: #f3c744;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; }
  .mark img { width: 52px; height: 52px; }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 10px; font-weight: 700; }
  p { font-size: 15px; line-height: 1.5; color: #a8a29e; margin: 0 0 24px; }
  button { -webkit-appearance: none; appearance: none; border: 0; cursor: pointer;
    background: #f3c744; color: #0d0d0f; font-weight: 700; font-size: 16px;
    padding: 14px 22px; border-radius: 12px; width: 100%; }
  .hint { margin-top: 18px; font-size: 13px; color: #78716c; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><img src="/icon-192.png" alt="Klown" /></div>
    <h1>You're offline</h1>
    <p>We can't reach the network right now. Your bill and payment need a connection. Move to a spot with better signal, or reconnect to Wi-Fi, then try again.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="hint">Nothing was charged.</div>
  </div>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
